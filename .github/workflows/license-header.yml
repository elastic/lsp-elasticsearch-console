name: License headers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          mode: check
