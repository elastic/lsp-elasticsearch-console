name: License headers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          mode: check
